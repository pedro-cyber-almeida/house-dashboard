<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Self-hosted health dashboard for your services." />
    <meta name="theme-color" content="#0f1218" />
    <title>House Dashboard</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/app.js"></script>
  </head>
  <body>
    <header class="topbar" id="topbar" hidden>
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name" data-brand>House Dashboard</span>
        <span class="brand-sep" aria-hidden="true">/</span>
        <span class="brand-sub" id="host">dashboard</span>
      </div>
      <div class="topbar-right">
        <span class="clock mono" id="clock">--:--:--</span>
        <span class="role-badge mono" id="role-badge">—</span>
        <button class="pill" id="theme-toggle" type="button" title="Toggle theme">◐ Theme</button>
        <button class="linknav" id="nav-settings" type="button" hidden>Settings</button>
        <button class="linknav" id="nav-admin" type="button" hidden>Admin</button>
        <span class="user-chip" title="" id="chip-wrap">
          <span class="chip-avatar" id="chip-avatar"></span>
          <span class="chip-name" id="chip-name">—</span>
        </span>
        <button class="linknav danger" id="logout" type="button">Sign out</button>
      </div>
    </header>

    <main id="view" class="wrap">
      <div class="page-loading">Loading…</div>
    </main>

    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
